<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luxury Obsidian/Midnight Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>

    <!-- Vibrant Electric Cyan-to-Cobalt Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Warm Golden North Star Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Precision Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- High-Precision Squircle Housing -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="2" />

  <!-- Modern Geometric 'US' Horizon Mark -->
  <g filter="url(#softGlow)">
    <!-- Architectural 'U' Base Curve -->
    <path d="M148 152 V270 C148 334 194 372 256 372 C318 372 364 334 364 270" 
          fill="none" 
          stroke="url(#cyanBlueGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pure White S-Curve / Upward Career Trajectory -->
    <path d="M184 212 C184 172 218 144 264 144 C318 144 348 178 348 218 C348 274 272 288 272 328 C272 346 288 358 312 358 C336 358 354 344 360 328" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.96" />

    <!-- Golden Beacon Spark (The North Star of US Careers) -->
    <circle cx="348" cy="144" r="20" fill="url(#goldGrad)" />
  </g>
</svg>
